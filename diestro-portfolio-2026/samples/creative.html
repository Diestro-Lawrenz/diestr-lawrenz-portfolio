<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex" />
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
        <link rel="stylesheet" href="../style.css" />
        <title>Interactive HTML5 Creative Preview</title>
    </head>
    <body>
        <div id="creative-card" aria-label="Animated travel creative preview">
            <img id="image1" src="../assets/sample-bg.jpg" alt="Thailand travel destination background" />
            <img id="image2" src="../assets/asset-1.jpg" alt="Cave Beach Resort in Pattaya" />
            <img id="image3" src="../assets/asset-2.jpg" alt="Sanctuary of Truth travel photo" />

            <img id="image5" src="../assets/asset-4.jpg" alt="Wat Arun temple travel photo" />
            <div id="bottom-gradient"></div>

            <p id="frame1headline">Explore the beauty of <br />Thailand</p>
            <p id="frame2headline">Cave Beach Resort, <br />Pattaya</p>
            <p id="frame3headline">Sanctuary of Truth</p>
            <p id="frame4headline">Thai Costume Uniform</p>

        <script src="./creative.js"></script>
